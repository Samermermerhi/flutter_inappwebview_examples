name: samer_merhi
description: My Payhip Store App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.5
flutter:
  uses-material-design: true
dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  # These two lines are critical to prevent crashes on modern Android
  adaptive_icon_background: "#ffffff" 
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  # This prevents the tool from hunting for missing Android files
  min_sdk_android: 21 

