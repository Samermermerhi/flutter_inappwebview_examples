name: payhip_store_app
description: Mobile app for my Payhip store with Push Notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.5
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  # Add this line for the native overlay layouts
  firebase_in_app_messaging: ^0.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
