plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.payhip_store_app"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.payhip_store_app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

// Injects the Firebase engine into your app layer
apply plugin: 'com.google.gms.google-services'
