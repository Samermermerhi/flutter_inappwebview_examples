name: Build Payhip App
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      # 1. Spins up platform infrastructure folders
      - name: Initialize App Shell
        run: flutter create --platforms=android --overwrite .

      # 2. Orders the compiler to overwrite the default template with your custom files
      - name: Restore Branded Files and Firebase Configs
        run: |
          git checkout lib/main.dart pubspec.yaml android/settings.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/google-services.json

      # 3. Copies your asset image into the resource tree layout folders dynamically
      - name: Inject Branded Icons
        run: |
          FOLDERS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for folder in "${FOLDERS[@]}"; do
            mkdir -p "android/app/src/main/res/$folder"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher.png"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher_round.png"
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: payhip-android-app, path: build/app/outputs/flutter-apk/app-release.apk}
