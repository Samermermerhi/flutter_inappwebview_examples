name: Build Payhip App
on: [push]

jobs:
  # --- ANDROID FACTORY ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      - name: Initialize Project
        run: flutter create --platforms=android,ios --overwrite .

      - name: Force Payhip Code
        run: git checkout lib/main.dart pubspec.yaml

      - name: Inject Permissions and Branded Icons
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' $MANIFEST
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' $MANIFEST
          FOLDERS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for folder in "${FOLDERS[@]}"; do
            mkdir -p "android/app/src/main/res/$folder"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher.png"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher_round.png"
          done
          sed -i 's/android:label="payhip_store_app"/android:label="Your Store Name"/g' $MANIFEST

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: payhip-android-app, path: build/app/outputs/flutter-apk/app-release.apk}

  # --- iOS FACTORY ---
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      - name: Initialize Project
        run: flutter create --platforms=android,ios --overwrite .

      - name: Force Payhip Code
        run: git checkout lib/main.dart pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Framework
        # This builds the raw iOS files without requiring Apple Certificates yet
        run: flutter build ios --release --no-codesign

      - name: Compress iOS Build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../payhip-ios-app.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with: {name: payhip-ios-app, path: payhip-ios-app.zip}
