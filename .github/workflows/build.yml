name: Build Payhip App
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      # 1. Create the template safely in a separate directory so it doesn't touch your repository files
      - name: Initialize Safe App Shell
        run: |
          flutter create --platforms=android ../temp_project
          # Copy only the missing system wrapper infrastructure files into your repository
          cp -r ../temp_project/android/gradle* ./android/
          cp ../temp_project/android/build.gradle ./android/
          cp ../temp_project/android/local.properties ./android/ 2>/dev/null || true

      # 2. Inject Branded Icons into all system density folders
      - name: Inject Branded Icons
        run: |
          FOLDERS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for folder in "${FOLDERS[@]}"; do
            mkdir -p "android/app/src/main/res/$folder"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher.png"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher_round.png"
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: payhip-android-app, path: build/app/outputs/flutter-apk/app-release.apk}
