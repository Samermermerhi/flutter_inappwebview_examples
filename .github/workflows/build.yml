name: Build Payhip App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      # 1. This creates only the MISSING platform folders
      - name: Initialize Platform Folders
        run: |
          flutter create --platforms=android,ios .
          # This specifically prevents the overwrite of your main.dart
          git checkout lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      # 2. This fixes the common 255 error for the icon tool
      - name: Fix Android Config
        run: sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      - name: Generate Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: payhip-android-app, path: build/app/outputs/flutter-apk/app-release.apk}
