name: Build Payhip App
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      - name: Initialize App Shell
        run: |
          flutter create --platforms=android --org com.example --project-name payhip_store_app .
          git checkout lib/main.dart pubspec.yaml

      - name: Inject System Permissions & Custom Store Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # 1. Grant absolute background notification and internet rights
          sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>' $MANIFEST
          
          # 2. BULLETPROOF CLEARTEXT FIX: Replaces the entire opening application tag to force security permission clearance
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST
          
          # 3. Update the label to your real store name
          sed -i 's/android:label="payhip_store_app"/android:label="Samer Merhi"/g' $MANIFEST


      - name: Inject Branded Icons
        run: |
          FOLDERS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for folder in "${FOLDERS[@]}"; do
            mkdir -p "android/app/src/main/res/$folder"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher.png"
            cp assets/icon/app_icon.png "android/app/src/main/res/$folder/ic_launcher_round.png"
          done

      - name: Compile Application
        run: |
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: payhip-android-app, path: build/app/outputs/flutter-apk/app-release.apk}
